id: batch
module: mcp/tools/ui-automation/batch
names:
  mcp: batch
  cli: batch
description: Execute structured rs/1 tap steps in one simulator session. Use refs from the latest snapshot_ui or wait_for_ui output, for example {"steps":[{"action":"tap","elementRef":"e1"},{"action":"tap","elementRef":"e2","postDelay":0.25}]}. Do not pass raw AXe strings such as "tap e7".
outputSchema:
  schema: xcodebuildmcp.output.ui-action-result
  version: '2'
routing:
  stateful: true
annotations:
  title: Batch UI Actions
  readOnlyHint: true
  destructiveHint: false
  openWorldHint: false
